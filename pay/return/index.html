<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Оплата — возврат</title>
    <meta name="robots" content="noindex,nofollow" />
    <!-- Мягкий автопереход в бота (в некоторых браузерах/клиентах может быть заблокирован) -->
    <meta http-equiv="refresh" content="7;url=https://t.me/FitnessPlusAI_Bot?start=from_fitai_landing" />
    <style>
      body {
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #0b0f14;
        color: #e8edf2;
      }
      .wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 560px;
        background: #121a23;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }
      h1 {
        margin: 0 0 16px;
        font-size: 24px;
        font-weight: 700;
        color: #e8edf2;
      }
      p {
        margin: 0 0 16px;
        line-height: 1.6;
        opacity: 0.95;
        font-size: 15px;
      }
      .hint {
        opacity: 0.75;
        font-size: 13px;
        margin-top: 20px;
        color: #94a3b8;
      }
      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 24px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 20px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: #e8edf2;
        background: rgba(255, 255, 255, 0.06);
        transition: all 0.2s ease;
      }
      .btn:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.2);
      }
      .btn.primary {
        background: #6366f1;
        border-color: #6366f1;
        color: #ffffff;
      }
      .btn.primary:hover {
        background: #4f46e5;
        border-color: #4f46e5;
      }
      .icon {
        width: 48px;
        height: 48px;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(99, 102, 241, 0.1);
        border-radius: 12px;
        font-size: 24px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="icon">💳</div>
        <h1>Оплата обрабатывается</h1>
        <p>
          Если оплата прошла успешно — Premium будет активирован автоматически в течение пары минут.
        </p>
        <p>
          Вернись в бот и продолжай путь к своей цели.
        </p>
        <div class="actions">
          <a class="btn primary" href="https://t.me/FitnessPlusAI_Bot?start=from_fitai_landing">Открыть бота</a>
          <a class="btn" href="/">На главную</a>
        </div>
        <div class="hint">
          Если бот не открылся автоматически — нажми «Открыть бота».
        </div>
      </div>
    </div>
  </body>
</html>
